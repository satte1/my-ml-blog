  <line x1="24" y1="32" x2="44" y2="32" stroke="#CFC7B4" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="38" x2="40" y2="38" stroke="#CFC7B4" stroke-width="1.5" stroke-linecap="round" />
